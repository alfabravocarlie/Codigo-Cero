name: Build Windows .exe

# Genera el .exe portable de Windows (un clic, sin instalar Python).
# Se lanza a mano desde Actions -> Build Windows .exe -> Run workflow,
# o automáticamente al publicar un tag v* (por ejemplo v0.1.0).
# El artefacto es Codigo-Cero-Windows.zip con Codigo-Cero.exe +
# models/README.md + LEEME.txt. Con un tag v* además se crea la Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build .exe with PyInstaller
        run: pyinstaller codigo-cero.spec

      - name: Smoke test (arranca el exe y pide la portada)
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "dist\Codigo-Cero.exe" -ArgumentList "--no-browser", "--port", "8765" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "El exe no respondió con HTTP 200 en http://127.0.0.1:8765/ tras 60 s." }
            Write-Host "Smoke test OK: HTTP 200 en /"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Package portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path portable\models | Out-Null
          Copy-Item dist\Codigo-Cero.exe portable\Codigo-Cero.exe
          Copy-Item models\README.md portable\models\README.md
          Copy-Item LEEME.txt portable\LEEME.txt
          Compress-Archive -Path portable\* -DestinationPath Codigo-Cero-Windows.zip -Force
          Get-ChildItem Codigo-Cero-Windows.zip | Select-Object Name, Length

      - name: Upload portable ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codigo-Cero-Windows
          path: Codigo-Cero-Windows.zip
          if-no-files-found: error

      - name: Create Release (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Codigo-Cero-Windows.zip
          generate_release_notes: true
