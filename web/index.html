<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Código Cero: aprende a programar desde cero con un tutor de IA local, lecciones cortas y ejercicios corregidos con tests.">
  <meta name="theme-color" content="#0a0d12">
  <title>Código Cero · Aprende a programar desde cero</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/markdown.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/editor.js"></script>
  <script defer src="js/chat.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#/inicio" aria-label="Código Cero, ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 42 42" width="42" height="42" fill="none" role="presentation">
            <defs>
              <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6ee7b7"/>
                <stop offset="1" stop-color="#7c9cff"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="40" height="40" rx="13" fill="url(#brandGradient)" opacity=".12"/>
            <rect x="1" y="1" width="40" height="40" rx="13" stroke="url(#brandGradient)" stroke-opacity=".4"/>
            <path d="M17.2 14.4 11.4 21l5.8 6.6" stroke="url(#brandGradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24.8 14.4 30.6 21l-5.8 6.6" stroke="url(#brandGradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="21" cy="21" rx="1.9" ry="2.6" stroke="url(#brandGradient)" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">Código Cero</span>
          <span class="brand-tagline">Aprende a programar desde cero</span>
        </span>
      </a>

      <nav class="nav" aria-label="Secciones">
        <p class="nav-label">Aprender</p>
        <a class="nav-link" href="#/inicio" data-nav="inicio" title="Inicio">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.8 12 3l9 7.8"/>
            <path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-5.5h4V21h3.5a1 1 0 0 0 1-1V9.5"/>
          </svg>
          <span class="nav-text">Inicio</span>
        </a>
        <a class="nav-link" href="#/nueva" data-nav="nueva" title="Nueva clase">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span class="nav-text">Nueva clase</span>
        </a>
        <a class="nav-link" href="#/labs" data-nav="labs" title="Laboratorios">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.5 3h5"/>
            <path d="M10.5 3v5.3L5.3 18a2 2 0 0 0 1.7 3h10a2 2 0 0 0 1.7-3l-5.2-9.7V3"/>
            <path d="M8 14h8"/>
          </svg>
          <span class="nav-text">Laboratorios</span>
        </a>
        <a class="nav-link" href="#/progreso" data-nav="progreso" title="Progreso">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18"/>
            <path d="M6.5 21v-8M12 21V5M17.5 21v-5"/>
          </svg>
          <span class="nav-text">Progreso</span>
        </a>

        <p class="nav-label">Sistema</p>
        <a class="nav-link" href="#/ajustes" data-nav="ajustes" title="Ajustes">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.6-1.5L14.1 2h-4.2l-.4 2.6a7.6 7.6 0 0 0-2.6 1.5l-2.3-1-2 3.4 2 1.5a7.7 7.7 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.6h4.2l.4-2.6a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4-2-1.5Z"/>
          </svg>
          <span class="nav-text">Ajustes</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-tools">
          <button class="tool-btn" id="theme-toggle" type="button" aria-label="Cambiar al tema claro" title="Cambiar tema">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
          </button>
          <button class="tool-btn" id="help-toggle" type="button" aria-label="Ver atajos y ayuda" title="Atajos y ayuda (?)">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M9.3 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.7 2.2-2.7 4"/>
              <path d="M12 17h.01"/>
            </svg>
          </button>
        </div>

        <a class="status-card" id="status-teacher" href="#/ajustes" aria-label="Estado del profesor. Abrir Ajustes">
          <span class="status-dot is-idle" id="teacher-dot"></span>
          <span class="status-copy">
            <span class="status-title" id="teacher-title">Profesor</span>
            <span class="status-sub" id="teacher-sub">Comprobando…</span>
          </span>
          <span class="status-chevron" aria-hidden="true">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 6 6 6-6 6"/>
            </svg>
          </span>
        </a>

        <a class="status-card" id="status-system" href="#/ajustes" aria-label="Estado del equipo. Abrir Ajustes">
          <span class="status-dot is-idle" id="system-dot"></span>
          <span class="status-copy">
            <span class="status-title" id="system-title">Equipo</span>
            <span class="status-sub" id="system-sub">Comprobando…</span>
          </span>
          <span class="status-chevron" aria-hidden="true">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 6 6 6-6 6"/>
            </svg>
          </span>
        </a>
      </div>
    </aside>

    <div class="workspace">
      <header class="view-head">
        <div class="view-heading">
          <nav class="crumbs" id="crumbs" aria-label="Migas de pan"></nav>
          <h1 class="view-title" id="view-title" tabindex="-1">Inicio</h1>
          <p class="view-subtitle" id="view-subtitle" hidden></p>
        </div>
        <div class="view-actions" id="view-actions"></div>
      </header>

      <main class="view" id="view" tabindex="-1" aria-label="Contenido principal"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <noscript>
    <div class="banner banner-warn" style="position:fixed;left:16px;bottom:16px;right:16px;z-index:2000;margin:0">
      <span class="banner-copy">
        <span class="banner-title">Código Cero necesita JavaScript</span>
        <span class="banner-text">Activa JavaScript en el navegador para usar las lecciones, el editor y el tutor.</span>
      </span>
    </div>
  </noscript>
</body>
</html>
